; PlatformIO Project Configuration File
;
[env:esp32-s3-zero]
; Arduino Release v3.3.7 based on ESP-IDF v5.5.2.260206
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-fh4r2
framework = arduino

; ESP32-S3-Zero: 4MB flash and 2MB quad PSRAM
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qio

build_flags =
    -std=gnu++2a
    -fno-exceptions
    -Wall
    -Wextra
    -O2  ; gyorsabb futás, kisebb bináris.
    -fdiagnostics-color=always
    -DCORE_DEBUG_LEVEL=3  
    -std=gnu++20

build_unflags = -std=gnu++11  ; Eltávolítja az alapértelmezett C++11 beállítást

board_build.f_cpu = 240000000L

board_build.filesystem = spiffs

lib_deps =
    adafruit/Adafruit GFX Library@^1.12.3
    adafruit/Adafruit ILI9341@^1.6.2
    adafruit/RTClib@^2.1.4

; Soros monitor
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0